<footer class="w-full border-t border-slate-800/80 bg-[#070b14] px-6 py-12 text-slate-300">
  <div class="mx-auto flex max-w-5xl flex-col items-center gap-7">

    <!-- Iconos circulares: WhatsApp, LinkedIn, GitHub -->

        rel="noopener noreferrer"

        class="flex h-11 w-11 items-center justify-center rounded-full border-2 border-cyan-400/80 text-cyan-300 transition duration-200 hover:-translate-y-0.5 hover:border-cyan-300 hover:bg-cyan-400/10 hover:text-cyan-200"
      >
        <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.52 3.48A11.82 11.82 0 0 0 12.04 0C5.45 0 .09 5.36.09 11.95c0 2.1.55 4.15 1.6 5.96L0 24l6.26-1.64a11.9 11.9 0 0 0 5.78 1.47h.01c6.59 0 11.95-5.36 11.95-11.95 0-3.19-1.24-6.19-3.48-8.4zm-8.47 18.34h-.01a9.9 9.9 0 0 1-5.05-1.38l-.36-.21-3.72.97.99-3.63-.24-.37a9.9 9.9 0 0 1-1.52-5.25c0-5.47 4.45-9.92 9.93-9.92 2.65 0 5.14 1.03 7.01 2.91a9.86 9.86 0 0 1 2.9 7.01c0 5.47-4.45 9.92-9.93 9.92zm5.44-7.43c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.09 4.49.71.31 1.27.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35z"/>
        </svg>
      </a>

      <!-- LinkedIn -->
      <a
        [href]="linkedinUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn"
        class="flex h-11 w-11 items-center justify-center rounded-full border-2 border-cyan-400/80 text-cyan-300 transition duration-200 hover:-translate-y-0.5 hover:border-cyan-300 hover:bg-cyan-400/10 hover:text-cyan-200"
      >
        <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 3A2 2 0 0 1 21 5V19A2 2 0 0 1 19 21H5A2 2 0 0 1 3 19V5A2 2 0 0 1 5 3H19M18.5 18.5V13.2A3.26 3.26 0 0 0 15.24 9.94C14.39 9.94 13.4 10.46 12.92 11.24V10.13H10.13V18.5H12.92V13.57C12.92 12.8 13.54 12.17 14.31 12.17A1.4 1.4 0 0 1 15.71 13.57V18.5H18.5M6.88 8.56A1.68 1.68 0 0 0 8.56 6.88C8.56 5.95 7.81 5.19 6.88 5.19A1.69 1.69 0 0 0 5.19 6.88C5.19 7.81 5.95 8.56 6.88 8.56M8.27 18.5V10.13H5.5V18.5H8.27Z"/>
        </svg>
      </a>

      <!-- GitHub -->
      <a
        [href]="githubUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
        class="flex h-11 w-11 items-center justify-center rounded-full border-2 border-cyan-400/80 text-cyan-300 transition duration-200 hover:-translate-y-0.5 hover:border-cyan-300 hover:bg-cyan-400/10 hover:text-cyan-200"
      >
        <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
        </svg>
      </a>
    </div>

    <!-- Botones de navegación iguales al navbar -->
    <nav aria-label="Navegación del pie de página" class="flex flex-wrap items-center justify-center gap-x-8 gap-y-3 text-sm font-medium text-slate-200">
      <a
        *ngFor="let item of navItems"
        [href]="item.href"
        class="transition duration-200 hover:text-cyan-300"
      >
        {{ item.label }}
      </a>
    </nav>

    <!-- Copyright -->
    <p class="text-center text-xs tracking-wide text-slate-400">
      © 2026 Santiago Andrés Rudas | All Rights Reserved
    </p>

  </div>
</footer>
