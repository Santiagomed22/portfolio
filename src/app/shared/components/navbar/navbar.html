<header class="sticky top-0 z-50 border-b border-slate-800/80 bg-[#090d16]/85 backdrop-blur-md">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3.5 sm:px-6">
    <!-- Marca / Nombre -->
    <a
      href="#"
      (click)="closeMenu()"
      class="font-mono text-sm font-semibold tracking-tight text-white transition hover:text-cyan-400"
    >
      <span class="text-cyan-400">&lt;</span>{{ profile.name }}<span class="text-cyan-400">/&gt;</span>
    </a>

    <!-- Navegación de escritorio -->
    <nav class="hidden items-center gap-6 text-sm text-slate-300 md:flex">
      <a href="#sobre-mi" class="transition hover:text-cyan-400">Sobre mí</a>
      <a href="#skills" class="transition hover:text-cyan-400">Skills</a>
      <a href="#experiencia" class="transition hover:text-cyan-400">Experiencia</a>
      <a href="#certificaciones" class="transition hover:text-cyan-400">Certificaciones</a>
      <a
        [href]="profile.socials.github"
        target="_blank"
        rel="noopener noreferrer"
        class="rounded-lg border border-slate-700/80 bg-slate-900/90 px-3 py-1.5 font-mono text-xs text-slate-200 transition hover:border-cyan-500/50 hover:text-cyan-300"
      >
        GitHub
      </a>
    </nav>

    <!-- Botón menú móvil -->
    <button
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Alternar menú de navegación"
      class="inline-flex items-center justify-center rounded-lg border border-slate-800 bg-slate-900/80 p-2 text-slate-300 transition hover:border-cyan-500/40 hover:text-white md:hidden"
    >
      @if (!menuOpen()) {
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      } @else {
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      }
    </button>
  </div>

  <!-- Menú desplegable móvil -->
  @if (menuOpen()) {
    <div class="border-t border-slate-800/80 bg-[#0d1322] px-4 py-4 md:hidden">
      <div class="flex flex-col space-y-3 text-sm text-slate-300">
        <a href="#sobre-mi" (click)="closeMenu()" class="py-1 transition hover:text-cyan-400">
          Sobre mí
        </a>
        <a href="#skills" (click)="closeMenu()" class="py-1 transition hover:text-cyan-400">
          Skills
        </a>
        <a href="#experiencia" (click)="closeMenu()" class="py-1 transition hover:text-cyan-400">
          Experiencia
        </a>
        <a href="#certificaciones" (click)="closeMenu()" class="py-1 transition hover:text-cyan-400">
          Certificaciones
        </a>
        <a
          [href]="profile.socials.github"
          target="_blank"
          rel="noopener noreferrer"
          (click)="closeMenu()"
          class="w-fit rounded-lg border border-slate-700/80 bg-slate-900 px-3 py-1.5 font-mono text-xs text-cyan-300"
        >
          GitHub
        </a>
      </div>
    </div>
  }
</header>
