<section id="sobre-mi" class="border-b border-slate-800/70 py-16 sm:py-24">
  <div class="mx-auto max-w-6xl px-4 sm:px-6">
    <div class="grid items-center gap-10 lg:grid-cols-12">
      <!-- Columna principal: presentación y acciones -->
      <div class="space-y-6 lg:col-span-7">
        <div class="inline-flex items-center gap-2 rounded-full border border-cyan-500/30 bg-cyan-950/30 px-3.5 py-1 font-mono text-xs text-cyan-300">
          <span class="h-2 w-2 rounded-full bg-cyan-400"></span>
          <span>// PERFIL &amp; DESARROLLO</span>
        </div>

        <div class="space-y-3">
          <h1 class="text-3xl font-bold tracking-tight text-white sm:text-5xl">
            {{ profile.name }}
          </h1>
          <p class="font-mono text-base text-cyan-400 sm:text-lg">
            {{ profile.tagline }}
          </p>
        </div>

        <p class="max-w-2xl text-base leading-relaxed text-slate-300 sm:text-lg">
          {{ profile.bio }}
        </p>

        <div class="flex flex-wrap items-center gap-4 pt-2">
          <a
            href="#experiencia"
            class="rounded-xl bg-cyan-500 px-5 py-2.5 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400"
          >
            Ver trayectoria
          </a>
          <a
            [href]="profile.cvPath"
            download
            class="rounded-xl border border-cyan-500/40 bg-cyan-950/30 px-5 py-2.5 font-mono text-sm text-cyan-300 transition hover:border-cyan-400 hover:bg-cyan-950/60"
          >
            Descargar CV
          </a>
          <a
            [href]="profile.socials.github"
            target="_blank"
            rel="noopener noreferrer"
            class="rounded-xl border border-slate-700/80 bg-[#0d1322] px-5 py-2.5 font-mono text-sm text-slate-200 transition hover:border-cyan-500/50 hover:text-cyan-300"
          >
            GitHub
          </a>
        </div>
      </div>

      <!-- Columna lateral: tarjeta de enfoque técnico y ubicación -->
      <div class="lg:col-span-5">
        <div class="rounded-2xl border border-slate-800 bg-[#0d1322] p-6 shadow-xl shadow-black/20">
          <div class="mb-4 flex items-center justify-between border-b border-slate-800/80 pb-3">
            <span class="font-mono text-xs uppercase tracking-wider text-cyan-400">
              Resumen de perfil
            </span>
            <span class="rounded-md border border-slate-700/80 bg-slate-900/90 px-2.5 py-0.5 font-mono text-xs text-slate-300">
              Activo
            </span>
          </div>

          <dl class="space-y-4 text-sm">
            <div>
              <dt class="font-mono text-xs text-slate-400">Ubicación</dt>
              <dd class="mt-0.5 font-medium text-slate-100">{{ profile.location }}</dd>
            </div>
            <div>
              <dt class="font-mono text-xs text-slate-400">Enfoque</dt>
              <dd class="mt-0.5 leading-relaxed text-slate-300">
                Aplicaciones web estructuradas, buenas prácticas de código, seguridad y resolución ordenada de problemas.
              </dd>
            </div>
          </dl>
        </div>
      </div>
    </div>
  </div>
</section>
